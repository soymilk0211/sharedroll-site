# 網頁相機(camera/)的檢查。camera/ 是 web/ 建出來、commit 進來的產物(GitHub Pages 直接發佈
# main 分支的根目錄),所以這裡多一步:重建一次,跟 commit 進來的那一份逐位元組比對。
name: camera

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 釘 commit SHA(v5),tag 可以被改指向。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: camera/ 跟 web/ 的原始碼一致
        run: |
          npm run build
          if [ -n "$(git status --porcelain camera/)" ]; then
            git status --porcelain camera/
            git diff --stat camera/
            echo "::error::camera/ 不是 web/ 建出來的那一份。在本機跑 npm run build,把 camera/ 一起 commit。"
            exit 1
          fi
      - name: 濾鏡 golden(WebGL2 對 App 的 CanvasKit,ΔE 平均 < 2)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run golden
